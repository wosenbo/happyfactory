<{include file="header.html"}>

<link rel="stylesheet" href="templates/assets/css/index.css">

<div id="app" class="container">
	<factory-list @buy="handleBuy"></factory-list>
	<dev-center ref="devCenter"></dev-center>
</div>

<script>

const FactoryList = {
	name: 'factory-list',
	data() {
		return {
			factories: [],
			loading: false,
			error: null
		};
	},
	mounted() {
		this.fetchFactories();
	},
	methods: {
		fetchFactories() {
			this.loading = true;
			this.error = null;

			$.getJSON('index.php', { action: 'factory' })
				.done((response) => {
					if (response.errcode === 0) {
						this.factories = response.factories;
					} else {
						throw new Error(response.errmsg || '获取工厂列表失败');
					}
				})
				.fail((xhr, textStatus, errorThrown) => {
					this.error = errorThrown || '获取工厂列表失败';
					console.error('获取工厂列表失败:', errorThrown);
				})
				.always(() => {
					this.loading = false;
				});
		},

		buyFactory(factory) {
			if (this.loading) return;

			this.loading = true;

			$.ajax({
				url: 'factory.php',
				type: 'POST',
				dataType: 'json',
				data: {
					action: 'buy',
					factid: factory.factid
				}
			})
				.done((response) => {
					if (response.errcode === 0) {
						const targetFactory = this.factories.find(f => f.factid === factory.factid);
						if (targetFactory) {
							targetFactory.status = 1;
						}

						this.$emit('buy');

						if (window.showMessage) {
							window.showMessage('购买成功', `成功购买 ${factory.name || '工厂'}！`);
						}
					} else {
						throw new Error(response.errmsg || '购买失败');
					}
				})
				.fail((xhr, textStatus, errorThrown) => {
					alert(errorThrown || '购买失败');
					console.error('购买工厂失败:', errorThrown);
				})
				.always(() => {
					this.loading = false;
				});
		}
	},
	template: `
		<div class="mod mod-factory">
			<h3>生产线</h3>
			<div class="main">
				<div v-if="loading" class="loading-container">
					<div class="loading"></div>
					<p>加载中...</p>
				</div>
				
				<div v-else-if="error" class="error-message">
					{{ error }}
					<button @click="fetchFactories" class="retry-btn">重试</button>
				</div>
				
				<ul v-else class="product-list clearfix">
					<li v-for="factory in factories" :key="factory.factid" class="product-item">
						<template v-if="factory.status === 1">
							<p>
								<a href="make.php">
									<img :src="\`images/factory/\${factory.pic_act}\`" 
										 :alt="\`\${factory.name || '工厂'} - 已激活\`"
										 loading="lazy">
								</a>
							</p>
							<p class="title">
								<a href="make.php" class="btn-enter">进入生产 »</a>
							</p>
						</template>
						
						<template v-else>
							<p>
								<img :src="\`images/factory/\${factory.pic}\`" 
									 :alt="\`\${factory.name || '工厂'} - 待购买\`"
									 loading="lazy">
							</p>
							<p class="title">
								<button @click="buyFactory(factory)" 
										:disabled="loading"
										class="btn-buy">
									{{ loading ? '处理中...' : '购买' }}
								</button>
							</p>
						</template>
					</li>
				</ul>
			</div>
		</div>
	`
};

const DevCenter = {
	name: 'dev-center',
	data() {
		return {
			type: null,
			userStudy: null,
			levelInfo: null,
			studies: [],
			showUpgradeDialog: false,
			loading: false,
			error: null
		};
	},
	mounted() {
		this.fetchStudies();
	},
	methods: {
		fetchStudies() {
			this.loading = true;
			this.error = null;

			$.getJSON('index.php?action=study')
				.done((response) => {
					if (response.errcode === 0) {
						this.studies = response.studies;
						this.userStudy = response.user_study;
					} else {
						throw new Error(response.errmsg || '获取研发信息失败');
					}
				})
				.fail((xhr, textStatus, errorThrown) => {
					this.error = errorThrown || '获取研发信息失败';
					console.error('获取研发信息失败:', errorThrown);
				})
				.always(() => {
					this.loading = false;
				});
		},

		queryUpgrade(upgradeType) {
			if (this.loading || !this.userStudy) return;

			this.loading = true;

			$.ajax({
				url: 'study.php',
				type: 'POST',
				dataType: 'json',
				data: {
					action: 'upgrade',
					type: upgradeType
				}
			})
				.done((response) => {
					if (response.errcode === 0) {
						this.levelInfo = response.level_info;
						this.type = upgradeType;
						this.showUpgradeDialog = true;
					} else {
						alert(response.errmsg || '查询升级信息失败');
					}
				})
				.fail((xhr, textStatus, errorThrown) => {
					alert(errorThrown || '查询升级信息失败');
					console.error('查询升级信息失败:', errorThrown);
				})
				.always(() => {
					this.loading = false;
				});
		},

		upgrade() {
			if (!this.type) return;

			this.loading = true;

			$.ajax({
				url: 'study.php',
				type: 'POST',
				dataType: 'json',
				data: {
					action: 'upgrade',
					confirm: 1,
					type: this.type
				}
			})
				.done((response) => {
					if (response.errcode === 0) {
						this.showUpgradeDialog = false;
						this.fetchStudies();
						if (window.showMessage) {
							window.showMessage('升级成功', '研发中心升级成功！');
						}
					} else {
						this.showUpgradeDialog = false;
						alert(response.errmsg || '升级失败');
					}
				})
				.fail((xhr, textStatus, errorThrown) => {
					alert(errorThrown || '升级失败');
					console.error('升级失败:', errorThrown);
				})
				.always(() => {
					this.loading = false;
				});
		},

		closeDialog() {
			this.showUpgradeDialog = false;
		}
	},
	template: `
		<div class="mod mod-dev">
			<h3>研发中心</h3>
			<div class="main clearfix">
				<div v-if="loading" class="loading-container">
					<div class="loading"></div>
					<p>加载中...</p>
				</div>
				
				<div v-else-if="error" class="error-message">
					{{ error }}
					<button @click="fetchStudies" class="retry-btn">重试</button>
				</div>
				
				<template v-else>
					<ul class="level-list">
						<li class="title">效率</li>
						<li v-for="study in studies" 
							:key="\`eff-\${study.level}\`"
							:class="{ current: userStudy && study.level === userStudy.elevel }">
							{{ study.efficiency }}% (Lv.{{ study.level }})
						</li>
						<li>
							<button @click="queryUpgrade(1)" 
									:disabled="!userStudy || loading"
									class="btn-upgrade">
								{{ loading ? '处理中...' : '升级' }}
							</button>
						</li>
					</ul>
					
					<ul class="level-list">
						<li class="title">成本</li>
						<li v-for="study in studies" 
							:key="\`cost-\${study.level}\`"
							:class="{ current: userStudy && study.level === userStudy.clevel }">
							{{ study.cost }}% (Lv.{{ study.level }})
						</li>
						<li>
							<button @click="queryUpgrade(2)" 
									:disabled="!userStudy || loading"
									class="btn-upgrade">
								{{ loading ? '处理中...' : '升级' }}
							</button>
						</li>
					</ul>
					
					<div class="dev-tips">
						<em>研发中心可以有效的为您提高生产效率并且会降低生产所需的成本！</em>
						<p>您已拥有了属于您自己的研发中心，在 <a href="make.php">生产中心</a> 里面会有等级标志，
						表示您可以享受到研发中心给您带来的效率的提升和成本的下降。</p>
					</div>
				</template>
			</div>
			
			<!-- 升级对话框 -->
			<div v-if="showUpgradeDialog" class="dialog-backdrop" @click="closeDialog">
				<div class="dialog" @click.stop>
					<div class="dialog-body">
						升级到 {{ levelInfo?.level }} 级研发中心需要 {{ levelInfo?.price }} 金币，是否需要升级？
					</div>
					<div class="dialog-footer">
						<button @click="upgrade" 
								:disabled="loading"
								class="btn-confirm">
							{{ loading ? '升级中...' : '确认升级' }}
						</button>
						<button @click="closeDialog" :disabled="loading">取消</button>
					</div>
				</div>
			</div>
		</div>
	`
};

// 主应用 - Vue 2 兼容版本
const App = {
	data() {
		return {
			devCenterRef: null
		};
	},
	methods: {
		handleBuy() {
			if (this.$refs.devCenter && this.$refs.devCenter.fetchStudies) {
				this.$refs.devCenter.fetchStudies();
			}
		}
	}
};

// 注册组件
Vue.component('factory-list', FactoryList);
Vue.component('dev-center', DevCenter);

// 创建 Vue 2 应用
new Vue({
	...App,
	el: '#app'
});
</script>
