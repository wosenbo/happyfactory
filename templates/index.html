<{include file="header.html"}>

<link rel="stylesheet" href="templates/assets/css/index.css">

<div id="app" class="container">
	<factory-list ref="fact" @buy="onBuy"></factory-list>
	<dev-center ref="dev"></dev-center>
</div>

<script>
const { ref, onMounted, inject } = Vue;

const FactoryList = {
	setup(props, { emit }) {
		const factories = ref([]);
		const loading = ref(false);
		const error = ref(null);
		
		const api = inject('api') || {
			get: (url, params) => $.getJSON(url, params),
			post: (url, data) => $.ajax({ url, type: 'POST', dataType: 'json', data })
		};

		const fetchFactories = async () => {
			try {
				loading.value = true;
				error.value = null;
				const response = await api.get('index.php', { action: 'factory' });
				
				if (response.errcode === 0) {
					factories.value = response.factories;
				} else {
					throw new Error(response.errmsg || '获取工厂列表失败');
				}
			} catch (err) {
				error.value = err.message;
				console.error('获取工厂列表失败:', err);
			} finally {
				loading.value = false;
			}
		};

		const buyFactory = async (factory) => {
			if (loading.value) return;
			
			try {
				loading.value = true;
				const response = await api.post('factory.php', {
					action: 'buy',
					factid: factory.factid
				});

				if (response.errcode === 0) {
					// 更新本地状态
					const targetFactory = factories.value.find(f => f.factid === factory.factid);
					if (targetFactory) {
						targetFactory.status = 1;
					}
					
					// 通知父组件
					emit('buy');
					
					// 显示成功消息
					window.showMessage?.('购买成功', `成功购买 ${factory.name || '工厂'}！`);
				} else {
					throw new Error(response.errmsg || '购买失败');
				}
			} catch (err) {
				alert(err.message);
				console.error('购买工厂失败:', err);
			} finally {
				loading.value = false;
			}
		};

		onMounted(() => {
			fetchFactories();
		});

		return {
			factories,
			loading,
			error,
			buyFactory,
			fetchFactories
		};
	},
	template: `
		<div class="mod mod-factory">
			<h3>生产线</h3>
			<div class="main">
				<div v-if="loading" class="loading-container">
					<div class="loading"></div>
					<p>加载中...</p>
				</div>
				
				<div v-else-if="error" class="error-message">
					{{ error }}
					<button @click="fetchFactories" class="retry-btn">重试</button>
				</div>
				
				<ul v-else class="product-list clearfix">
					<li v-for="factory in factories" :key="factory.factid" class="product-item">
						<template v-if="factory.status === 1">
							<p>
								<a href="make.php">
									<img :src="\`images/factory/\${factory.pic_act}\`" 
										 :alt="\`\${factory.name || '工厂'} - 已激活\`"
										 loading="lazy">
								</a>
							</p>
							<p class="title">
								<a href="make.php" class="btn-enter">进入生产 »</a>
							</p>
						</template>
						
						<template v-else>
							<p>
								<img :src="\`images/factory/\${factory.pic}\`" 
									 :alt="\`\${factory.name || '工厂'} - 待购买\`"
									 loading="lazy">
							</p>
							<p class="title">
								<button @click="buyFactory(factory)" 
										:disabled="loading"
										class="btn-buy">
									{{ loading ? '处理中...' : '购买' }}
								</button>
							</p>
						</template>
					</li>
				</ul>
			</div>
		</div>
	`
};

Vue.component('factory-list', FactoryList);
	data () {
		return {
			factory: null,
			factories: []
		}
	},
	mounted: function () {
		this.listFactory();
	},
	methods: {
		listFactory () {
			$.getJSON('index.php', {action: 'factory'}, (res) => {
				if (res.errcode == 0) {
					this.$data.factories = res.factories;
				}
			})
		},
		buy (factory) {
			this.$data.factory = factory;
			$.ajax({
				url: 'factory.php',
				type: 'POST',
				dataType: 'json',
				data: {action: 'buy', factid: factory.factid},
				success: (res) => {
					if (res.errcode != 0) {
						alert(res.errmsg);
						return;
					}

					this.$emit('buy');

					$.each(this.$data.factories, (index, fact) => {
						if (fact.factid == factory.factid) {
							fact.status = 1;
						}
					});
				}
			});
		}
	},
	template: `
		<div class="mod mod-factory">
			<h3>生产线</h3>
			<div class="main">
	      <ul class="clearfix">
	        <li v-for="factory in factories" class="product-item">
	        	<template v-if="factory.status == 1">
		        	<p><a href="make.php"><img :src="'images/factory/' + factory.pic_act"></a></p>
		        	<p class="title"><a href="make.php">进入生产&gt;&gt;&gt;</a></p>
		        </template>
	        	<template v-else>
		        	<p><img :src="'images/factory/' + factory.pic"></p>
		        	<p class="title"><a @click="buy(factory)">购买</a></p>
		        </template>
	        </li>
	      </ul>
	    </div>
		</div>
	`
});


Vue.component('dev-center', {
	data () {
		return {
			type: null,
			user_study: null,
			level_info: null,
			studies: [],
			showUpgradeDialog: false
		}
	},
	mounted: function () {
		this.listStudy();

		this.$nextTick(() => {
			this.$on('update', () => {
				this.listStudy();
			});
		});
	},
	methods: {
		listStudy () {
			$.getJSON('index.php?action=study', (res) => {
				if (res.errcode == 0) {
					this.$data.studies = res.studies;
					this.$data.user_study = res.user_study;
				}
			});
		},
		queryUpgrade (type) {
	    $.ajax({
	        url: 'study.php',
	        dataType: 'json',
	        data: {action: 'upgrade', type: type},
	        type: 'POST',
	        success: (res) => {
	            if (res.errcode != 0) {
	            	alert(res.errmsg);
	            	return;
	            }
	            this.$data.level_info = res.level_info;
	            this.$data.type = type;
	            this.showUpgradeDialog = true;
	        }
	    });
		},
		upgrade () {
			this.$data.showUpgradeDialog = false;
			let type = this.$data.type;
	    $.ajax({
	        url: 'study.php',
	        dataType: 'json',
	        data: {action: 'upgrade', confirm: 1, type: type},
	        type: 'POST',
	        success: (res) => {
	            if (res.errcode != 0) {
	            	alert(res.errmsg);
	            	return;
	            }
	            this.listStudy();
	        }
	    });
		}
	},
	template: `
		<div class="mod mod-dev">
			<h3>研发中心</h3>
			<div class="main clearfix">
				<ul class="lv">
					<li class="title">效率</li>
					<li v-for="study in studies" :class="user_study && study.level == user_study.elevel ? 'cur' : ''">{{ study.efficiency }}% (Lv.{{ study.level }})</li>
					<li><button type="button" @click="queryUpgrade(1)" :disabled="!user_study">升级</button></li>
				</ul>
				<ul class="lv">
					<li class="title">成本</li>
					<li v-for="study in studies" :class="user_study && study.level == user_study.clevel ? 'cur' : ''">{{ study.cost }}% (Lv.{{ study.level }})</li>
					<li><button type="button" @click="queryUpgrade(2)" :disabled="!user_study">升级</button></li>
				</ul>
				<div class="tips">
					<em>研发中心可以有效的为您提高生产较率并且会降低生产所需的成本！</em>
					您已拥有了属于您自已的研发中心，在 <a href="make.php">生产中心</a> 里面会有等级标志，表示您可以享受到研发中心给您带来的效率的提升和成本的下降。
				</div>
			</div>
			<div v-if="showUpgradeDialog" class="dialog">
				<div class="dialog-body">升级到 {{ level_info.level }} 级研发中心需要 {{ level_info.price }} 金币，是否需要升级？</div>
				<div class="dialog-footer">
					<button type="button" @click="upgrade">升级</button>
					<a @click="showUpgradeDialog = false">取消</a>
				</div>
			</div>
		</div>
	`
});

var app = new Vue({
	el: "#app",
	data: {
	},
	mounted: function () {
	},
	methods: {
		onBuy () {
			this.$refs.dev.$emit('update');
		}
	}
});
</script>
